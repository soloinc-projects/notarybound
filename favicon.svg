  <title id="title">Notarybound</title>
  <desc>The Notarybound mark on a 24-unit grid, y growing downward: a bound book with a notary's seal on its cover, on a berry tile with corners of radius 5.4. The cover (4.8 2.8 18.4 19.8 1.15: left, top, right, bottom, corner radius) has a bound spine 2.1 wide down its left edge; the page block (5.7 3.6 19.4 20.6 1) shows behind it to the right and below; a ribbon marker (15.3 16.9 22.1 0.8: left, right, the foot's tips, the V notch's depth) hangs below. The seal (5.25 4.92 32: tooth-tip radius, tooth-root radius, number of teeth) sits in the middle of the cover's face, right of the spine; it has an engraved rim (4.42 0.36: radius, width), an engraved inner ring (3.62 0.36) and at its centre a section sign (0.86 0.8 325 145: loop radius, stroke width, the top hook's start angle and the bottom hook's end angle in degrees), three loops stacked on the seal's centre, each two loop-radii apart. Written by assets/generate-assets.py --write-logo from the data- numbers on the grid element; never edited by hand.</desc>
